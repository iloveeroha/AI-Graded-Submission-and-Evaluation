<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Contact Us | My Data Science Project</title>
  <link rel="stylesheet" href="Contact.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="My Data Science Project home">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span>My Data Science Project</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="About.html">About</a>
      <a href="Contact.html" class="active" aria-current="page">Contact Us</a>
    </nav>
  </header>

  <main>
    <section class="contact-section" aria-labelledby="page-title">
      <div class="contact-copy">
        <p class="eyebrow">WE'D LOVE TO HEAR FROM YOU</p>
        <h1 id="page-title">Let's get in touch.</h1>
        <p class="intro">
          Have a question about the project or want to share feedback?
          Send us an email and we'll be happy to hear from you.
        </p>

        <div class="contact-card">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M3.75 6.75h16.5v10.5H3.75z"></path>
              <path d="m4.5 7.5 7.5 6 7.5-6"></path>
            </svg>
          </span>
          <div>
            <h2>Email</h2>
            <a href="mailto:iloveeroha@gmail.com">iloveeroha@gmail.com</a>
          </div>
        </div>
      </div>

      <div class="illustration-wrap">
        <img
          class="contact-illustration"
          src="contact-illustration.svg"
          alt="An envelope with a message, surrounded by data-inspired shapes"
          width="520"
          height="420">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Data Science Project</p>
  </footer>
</body>
</html>
